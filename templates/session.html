{% extends "base.html" %}
{% block title %}{{ s.track }} · ACE Viewer{% endblock %}
{% block crumb %}{{ s.car }} · {{ s.track }}{% endblock %}
{% block content %}
<div class="panel laps-bar">
  <div class="laps-head">
    <h3>Giri <span id="track-name" style="color:var(--dim);text-transform:none;letter-spacing:0"></span></h3>
    <button class="btn ghost" id="add-compare">+ confronta altri piloti</button>
  </div>
  <div class="laps-scroll">
    <table class="laps" id="laps">
      <thead><tr><th></th><th>Pilota</th><th>Giro</th><th>Tempo</th><th>Δ best</th><th>V max</th></tr></thead>
      <tbody id="laps-body"></tbody>
    </table>
  </div>
  <p id="laps-note" style="color:var(--dim);font-size:11px;margin-top:8px"></p>
  <div id="compare-panel" class="compare-panel" hidden></div>
</div>

<div class="layout">
  <div class="panel stats" id="stats">
    <h3>Statistiche giro</h3>
    <div id="stats-body" class="stats-body"></div>
  </div>
  <div class="panel" id="map-wrap">
    <h3>Tracciato <span style="color:var(--dim);text-transform:none;letter-spacing:0">(giro di riferimento · colore = velocità)</span></h3>
    <canvas id="map" width="900" height="700"></canvas>
  </div>
</div>

<div class="charts" id="charts"></div>

<script>const SID="{{ s.id }}";</script>
<script src="{{ url_for('static', filename='session.js') }}"></script>
{% endblock %}
