{% extends "base.html" %}
{% block title %}{{ s.track }} · ACE Viewer{% endblock %}
{% block crumb %}{{ s.car }} · {{ s.track }}{% endblock %}
{% block content %}
<div class="panel statbar"><div id="stats-body" class="statbar-body"></div></div>

<div class="panel laps-bar">
  <div class="laps-head">
    <h3>Giri <span id="track-name" style="color:var(--dim);text-transform:none;letter-spacing:0"></span></h3>
    <span id="weather" class="weather"></span>
    <button class="btn-primary sm" id="add-compare">+ confronta altri piloti</button>
  </div>
  <div class="laps-scroll">
    <table class="laps" id="laps">
      <thead><tr><th></th><th>Pilota</th><th>Giro</th><th>Tempo</th><th>Δ best</th><th>V max</th><th>Meteo</th></tr></thead>
      <tbody id="laps-body"></tbody>
    </table>
  </div>
  <p id="laps-note" style="color:var(--dim);font-size:11px;margin-top:8px"></p>
</div>

<div class="layout2">
  <div class="charts" id="charts">
    <div class="charts-tools"><button class="chip" id="chan-open">+ Canali telemetria</button></div>
  </div>
  <div class="panel mapcol" id="map-wrap">
    <div class="map-head">
      <h3>Tracciato</h3>
      <div class="map-modes">
        <button class="chip mode-btn active" data-mode="speed">Velocità</button>
        <button class="chip mode-btn" data-mode="input">Staccata / Gas</button>
        <span class="map-zoom">
          <button class="chip" id="zoom-out">−</button>
          <button class="chip" id="zoom-in">+</button>
          <button class="chip" id="zoom-reset">reset</button>
        </span>
      </div>
    </div>
    <canvas id="map" width="900" height="820"></canvas>
    <div class="map-legend" id="map-legend"></div>
  </div>
</div>

<div id="compare-modal" class="modal" hidden>
  <div class="modal-card">
    <div class="modal-head"><span>Aggiungi un giro (stessa pista e categoria)</span><button id="compare-close" class="modal-x">✕</button></div>
    <div id="compare-body" class="compare-body"></div>
  </div>
</div>
<div id="chan-modal" class="modal" hidden>
  <div class="modal-card">
    <div class="modal-head"><span>Canali telemetria</span><button id="chan-close" class="modal-x">✕</button></div>
    <div id="chanpick" class="chanpick"></div>
  </div>
</div>
<div id="valbox" class="valbox" hidden></div>

<script>const SID="{{ s.id }}";</script>
<script src="{{ url_for('static', filename='session.js') }}"></script>
{% endblock %}
