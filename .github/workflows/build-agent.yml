name: build-agent
on:
  workflow_dispatch:
  push:
    paths:
      - "agent/**"
      - ".github/workflows/build-agent.yml"
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller requests
      - run: pyinstaller --onefile --name ace-agent agent/watcher.py
      - uses: actions/upload-artifact@v4
        with:
          name: ace-agent-windows
          path: dist/ace-agent.exe
